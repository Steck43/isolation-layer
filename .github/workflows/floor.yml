# The floor. This is the layer that cannot be bypassed by the committer.
#
# Pre-commit hooks are local and `--no-verify` defeats all of them, so they are
# convenience, not control. This runs on GitHub's machines on every push and
# every pull request, including PRs from forks. Make these checks Required in
# branch protection and the floor is real.
#
# Same argument as the capability gate: the decision must not be made by the
# thing being guarded.
#
# Action pins are commit SHAs (Hermes / estate supply-chain policy). Bump by
# resolving a release tag to its peeled commit, then editing both the SHA and
# the trailing version comment.
#
# Craft BASE (2026-08-18): on pull_request use the PR base SHA; on push use
# github.event.before. Never fall back to the root commit. Empty range
# (BASE == HEAD) exits 3 — that is "nothing in scope", not success.
# Craft jobs skip schedule and workflow_dispatch (HEAD == default branch).
#
# floor-version: 2
# Push trigger is every branch so master roofs get default-branch CI.
# Ruff is pinned; unpinned install pulled 0.16.3 and reddened newwave.

name: floor

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

concurrency:
  group: floor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: secrets (gitleaks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  authorship:
    name: authorship (no AI trailers)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: check commit messages in history
        run: |
          if git log --all --format=%B | grep -inE \
            'co-authored-by:.*(claude|cursor|copilot|gpt|gemini|assistant)|generated with .*(claude|cursor|copilot)'; then
            echo "::error::AI authorship trailer found in history"
            exit 1
          fi
          echo "no AI authorship trailers in history"

  tests:
    name: tests (${{ matrix.python }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          INSTALLED=
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
            INSTALLED="${INSTALLED}+requirements"
          fi
          if [ -f requirements-dev.txt ]; then
            python -m pip install -r requirements-dev.txt
            INSTALLED="${INSTALLED}+requirements-dev"
          fi
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
            INSTALLED="${INSTALLED}+pyproject"
          fi
          python -m pip install pytest
          echo "install-branch: ${INSTALLED:-none-only-pytest}"
      - name: pytest
        # Do NOT add a step that installs the host agent to make skipped tests
        # run. On capability-gate that turns a green 37-passed/2-skipped suite
        # red in two different ways depending on which of two same-named modules
        # lands on the path. The skips are correct behaviour.
        run: PYTHONPATH=. python -m pytest -q

  rust-tests:
    name: rust (cargo test)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo test
        run: cargo test --workspace

  demo:
    name: demo (make demo-all)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Exits non-zero on any FAIL row; writes out/summary.json.
      - name: make demo-all
        run: make demo-all
      # Every number in the README Proof section must match that summary.
      - name: README proof numbers
        run: python -I scripts/readme_proof.py check

  route-door:
    name: route door (sandbox-demo tests, rustfmt)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      # cargo and rustfmt come with the ubuntu-latest image; no toolchain action.
      - name: toolchain
        run: cargo --version && rustfmt --version
      # Older demo files and crates/ predate this check, so it names the route
      # door files; widen the list as other files are formatted.
      - name: rustfmt --check (route door files)
        run: >-
          rustfmt --check --edition 2021
          demos/sandbox-demo/src/route.rs
          demos/sandbox-demo/tests/route.rs
          demos/sandbox-demo/tests/route_mutation.rs
      # The demo crate is its own workspace, so cargo test --workspace skips it.
      - name: sandbox-demo tests
        run: make demo-test

  lint:
    name: lint (ruff)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.15.15,<0.16"
      - run: ruff check .
      - run: ruff format --check .

  craft-voice:
    name: craft (voice)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: voice lint (commits + prose)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The script that picks BASE comes from the base the event names, so a
          # change to it cannot choose the range it is judged on. No fallback.
          SRC="$PR_BASE"
          if [ -z "$SRC" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then SRC="$PUSH_BEFORE"; fi
          if [ -z "$SRC" ]; then SRC="$(git rev-parse --verify origin/HEAD 2>/dev/null || git rev-parse --verify origin/main)"; fi
          mkdir -p "${RUNNER_TEMP}/craft"
          if ! git cat-file -e "${SRC}:.floor/craft/resolve_base.sh"; then
            echo "::error::base ${SRC} has no resolve_base.sh; refusing to run the pull request copy"
            exit 1
          fi
          git show "${SRC}:.floor/craft/resolve_base.sh" > "${RUNNER_TEMP}/craft/resolve_base.sh"
          . "${RUNNER_TEMP}/craft/resolve_base.sh"
          # The lint that judges the change comes from the base, so a change to
          # the lint cannot judge itself. No fallback to the change's copy.
          mkdir -p "${RUNNER_TEMP}/voice"
          if ! git cat-file -e "${BASE}:.floor/craft/voice_lint.py"; then
            echo "::error::base ${BASE} has no voice lint; refusing to run the pull request copy"
            exit 1
          fi
          git show "${BASE}:.floor/craft/voice_lint.py" > "${RUNNER_TEMP}/voice/voice_lint.py"
          python3 -I "${RUNNER_TEMP}/voice/voice_lint.py" --commits --base "$BASE" --head HEAD --prose --fail-on-warn

  craft-changelog:
    name: craft (changelog)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: changelog gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The script that picks BASE comes from the base the event names, so a
          # change to it cannot choose the range it is judged on. No fallback.
          SRC="$PR_BASE"
          if [ -z "$SRC" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then SRC="$PUSH_BEFORE"; fi
          if [ -z "$SRC" ]; then SRC="$(git rev-parse --verify origin/HEAD 2>/dev/null || git rev-parse --verify origin/main)"; fi
          mkdir -p "${RUNNER_TEMP}/craft"
          if ! git cat-file -e "${SRC}:.floor/craft/resolve_base.sh"; then
            echo "::error::base ${SRC} has no resolve_base.sh; refusing to run the pull request copy"
            exit 1
          fi
          git show "${SRC}:.floor/craft/resolve_base.sh" > "${RUNNER_TEMP}/craft/resolve_base.sh"
          . "${RUNNER_TEMP}/craft/resolve_base.sh"
          if [ -f .floor/craft/changelog_gate.py ]; then C=.floor/craft/changelog_gate.py
          elif [ -f craft/changelog_gate.py ]; then C=craft/changelog_gate.py
          else
            echo "::error::changelog_gate.py missing from roof"
            exit 1
          fi
          python "$C" --base "$BASE" --head HEAD

  craft-comments:
    name: craft (comments)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: comment craft
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The script that picks BASE comes from the base the event names, so a
          # change to it cannot choose the range it is judged on. No fallback.
          SRC="$PR_BASE"
          if [ -z "$SRC" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then SRC="$PUSH_BEFORE"; fi
          if [ -z "$SRC" ]; then SRC="$(git rev-parse --verify origin/HEAD 2>/dev/null || git rev-parse --verify origin/main)"; fi
          mkdir -p "${RUNNER_TEMP}/craft"
          if ! git cat-file -e "${SRC}:.floor/craft/resolve_base.sh"; then
            echo "::error::base ${SRC} has no resolve_base.sh; refusing to run the pull request copy"
            exit 1
          fi
          git show "${SRC}:.floor/craft/resolve_base.sh" > "${RUNNER_TEMP}/craft/resolve_base.sh"
          . "${RUNNER_TEMP}/craft/resolve_base.sh"
          if [ -f .floor/craft/comment_craft.py ]; then C=.floor/craft/comment_craft.py
          elif [ -f craft/comment_craft.py ]; then C=craft/comment_craft.py
          else
            echo "::error::comment_craft.py missing from roof"
            exit 1
          fi
          python "$C" --base "$BASE" --head HEAD

  workflow-lint:
    name: workflow (zizmor + actionlint)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o /tmp/actionlint.tgz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/actionlint.tgz actionlint
          /tmp/actionlint -color

  public-surface:
    # The scanner comes from the base branch, never from the pull request under
    # review, and runs from a temp folder with the standard library only. This
    # job installs nothing and is the only place the private list is exposed.
    name: public surface (scanner from base)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: load the scanner from the base branch
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -n "${PR_BASE}" ]; then
            BASE="${PR_BASE}"
          else
            git fetch --no-tags origin main
            BASE="$(git rev-parse origin/main)"
          fi
          mkdir -p "${RUNNER_TEMP}/pss"
          if ! git cat-file -e "${BASE}:scripts/public_surface_scan.py"; then
            echo "::error::base ${BASE} has no scanner; refusing to run the pull request copy"
            exit 1
          fi
          git show "${BASE}:scripts/public_surface_scan.py" > "${RUNNER_TEMP}/pss/public_surface_scan.py"
          echo "scanner from base ${BASE}: $(sha256sum "${RUNNER_TEMP}/pss/public_surface_scan.py" | cut -c1-64)"
      - name: scan every tracked file
        env:
          LEAK_DENYLIST: ${{ secrets.LEAK_DENYLIST }}
        run: |
          set -euo pipefail
          if [ -z "${LEAK_DENYLIST}" ]; then
            echo "::error::LEAK_DENYLIST is not available to this run (fork or missing secret); failing closed"
            exit 1
          fi
          python3 -I -S "${RUNNER_TEMP}/pss/public_surface_scan.py" --root "${GITHUB_WORKSPACE}"
