# No pip ecosystem here: this roof has no requirements.txt / pyproject.toml /
# setup.py. A pip entry produced Dependabot dependency_file_not_found (red run
# 37385460556). Re-add pip only when a lockfile or requirements.txt lands.
# Dependabot PRs pass the floor; no bypass actor.
# cooldown.default-days: 7 — zizmor dependabot-cooldown. GitHub's implicit default
# is 3 days, which is below the floor.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
