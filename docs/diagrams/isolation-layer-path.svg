<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="t d">
  <title id="t">Isolation path: host listener, jailer, microVM, vsock, inspector, dropbox</title>
  <desc id="d">A task enters the host listener in vestibule, which applies seccomp default KILL and Landlock. jailer_argv launches one Firecracker microVM. vsock_roundtrip is the control plane. decide_disposition reads the inspector verdict. content_hash checks the dropbox hand-back.</desc>
  <rect width="880" height="220" fill="#f6f8fa"/>
  <style>
    .box { fill: #ffffff; stroke: #24292f; stroke-width: 1.4; }
    .lab { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #24292f; }
    .small { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #57606a; }
    .edge { stroke: #24292f; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292f"/>
    </marker>
  </defs>
  <rect class="box" x="16" y="36" width="130" height="64" rx="6"/>
  <text class="lab" x="81" y="62" text-anchor="middle">Host listener</text>
  <text class="small" x="81" y="80" text-anchor="middle">harden.rs</text>
  <rect class="box" x="170" y="36" width="120" height="64" rx="6"/>
  <text class="lab" x="230" y="62" text-anchor="middle">Jailer</text>
  <text class="small" x="230" y="80" text-anchor="middle">jailer_argv</text>
  <rect class="box" x="314" y="36" width="150" height="64" rx="6"/>
  <text class="lab" x="389" y="62" text-anchor="middle">Firecracker</text>
  <text class="small" x="389" y="80" text-anchor="middle">one microVM</text>
  <rect class="box" x="488" y="36" width="120" height="64" rx="6"/>
  <text class="lab" x="548" y="62" text-anchor="middle">vsock</text>
  <text class="small" x="548" y="80" text-anchor="middle">vsock_roundtrip</text>
  <rect class="box" x="632" y="36" width="110" height="64" rx="6"/>
  <text class="lab" x="687" y="62" text-anchor="middle">Inspector</text>
  <text class="small" x="687" y="80" text-anchor="middle">decide_disposition</text>
  <rect class="box" x="756" y="36" width="108" height="64" rx="6"/>
  <text class="lab" x="810" y="62" text-anchor="middle">Dropbox</text>
  <text class="small" x="810" y="80" text-anchor="middle">content_hash</text>
  <path class="edge" d="M146 68 H170"/>
  <path class="edge" d="M290 68 H314"/>
  <path class="edge" d="M464 68 H488"/>
  <path class="edge" d="M608 68 H632"/>
  <path class="edge" d="M742 68 H756"/>
  <text class="small" x="16" y="130">seccomp SECCOMP_RET_KILL_PROCESS and Landlock ABI 1 path-beneath, host listener, not the guest.</text>
  <text class="small" x="16" y="148">Sources: crates/vestibule/src/harden.rs, crates/jailer-launch/src/jailer_cmd.rs,</text>
  <text class="small" x="16" y="166">crates/aegis-common/src/firecracker.rs, crates/inspector/src/verdict.rs, crates/dropbox/src/lib.rs.</text>
  <text class="small" x="16" y="196">always_invoked stays false. This figure is the path, not a claim that every permitted call enters it.</text>
</svg>
