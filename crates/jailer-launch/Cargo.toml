[package]
name = "jailer-launch"
version.workspace = true
edition.workspace = true

[[bin]]
name = "jailer-launch"
path = "src/main.rs"

[dependencies]
aegis-common = { path = "../aegis-common" }
clap = { version = "4", features = ["derive"] }
